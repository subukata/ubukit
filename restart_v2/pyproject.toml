[build-system]
requires=["setuptools>=77"]
build-backend="setuptools.build_meta"
[project]
name="portable-accel-restart"
version="0.2.0a2"
description="New restart-v2 research foundation"
readme="README.md"
license-files=["LICENSE-SOM.txt","NOTICE.txt"]
requires-python=">=3.10"
dependencies=["numpy>=1.24","scipy>=1.10","scikit-learn>=1.3","threadpoolctl>=3"]
[project.optional-dependencies]
numba=["numba>=0.60"]
[tool.setuptools.packages.find]
include=["portable_accel*"]
