# Runs on every pull request on Ubuntu, and by hand (Actions > CI > Run
# workflow) on one operating system per run: Windows and macOS once each
# before a release. Standard runners cost nothing in a public repository;
# while the repository is private, where Actions minutes are paid (macOS 10x,
# Windows 2x), pull requests skip every job.
name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system for this run
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest]
        default: ubuntu-latest

permissions:
  contents: read

# A new push to a pull request cancels its earlier run; runs started by hand
# never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    name: Python ${{ matrix.python }} (${{ inputs.os || 'ubuntu-latest' }})
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: ruff check . ../fixtures ../bench
      - run: ruff format --check . ../fixtures ../bench
      - run: mypy
      - run: pytest

  python-oldest:
    if: >-
      (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
      && (inputs.os || 'ubuntu-latest') == 'ubuntu-latest'
    name: Python oldest supported dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "numpy==2.2.*" "scipy==1.15.*" -e . --group dev
      - run: pytest

  packages:
    if: >-
      (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
      && (inputs.os || 'ubuntu-latest') == 'ubuntu-latest'
    name: Build release artifacts and smoke-run the benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: python -m pip install build twine
      - run: python -m build python --outdir dist
      - run: python -m twine check --strict dist/*
      - run: npm ci --ignore-scripts
        working-directory: js
      # Runs prepack, i.e. the type-declaration build that publishing uses.
      - run: npm pack --dry-run
        working-directory: js
      # The benchmark at a tiny size, failing if Python and JavaScript disagree
      # on any deterministic case (a parity check at larger sizes than the fixtures).
      - run: python -m pip install -e . --group dev
        working-directory: python
      - run: python bench/run.py --size smoke --check

  javascript:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    name: Node ${{ matrix.node }} (${{ inputs.os || 'ubuntu-latest' }})
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Dependencies need no install scripts; skipping them shrinks the
      # supply-chain surface. Our own prepack still runs in "npm pack".
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check

  # The one check the main ruleset requires: it fails when any job above
  # failed or was cancelled, so jobs can be added, removed or renamed (a new
  # Python or Node version) without changing the ruleset. A skipped job counts
  # as passed, as GitHub reports a skipped required check.
  all:
    if: always() && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    name: All checks
    needs: [python, python-oldest, packages, javascript]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
