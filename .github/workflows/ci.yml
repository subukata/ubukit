# Runs only when started by hand (Actions > CI > Run workflow), one operating
# system per run: Actions minutes are limited while the repository is private,
# and macOS counts 10x, Windows 2x. Run it before a release, not for every
# change; the checks in CONTRIBUTING.md run locally.
name: CI

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system for this run
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest]
        default: ubuntu-latest
      minutes_checked:
        description: I checked the remaining Actions minutes
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  python:
    if: inputs.minutes_checked
    name: Python ${{ matrix.python }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: ruff check . ../fixtures ../bench
      - run: ruff format --check . ../fixtures ../bench
      - run: mypy
      - run: pytest

  python-oldest:
    if: inputs.minutes_checked && inputs.os == 'ubuntu-latest'
    name: Python oldest supported dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "numpy==2.2.*" "scipy==1.15.*" -e . --group dev
      - run: pytest

  packages:
    if: inputs.minutes_checked && inputs.os == 'ubuntu-latest'
    name: Build release artifacts and smoke-run the benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: python -m pip install build twine
      - run: python -m build python --outdir dist
      - run: python -m twine check --strict dist/*
      - run: npm ci --ignore-scripts
        working-directory: js
      # Runs prepack, i.e. the type-declaration build that publishing uses.
      - run: npm pack --dry-run
        working-directory: js
      # The benchmark at a tiny size, failing if Python and JavaScript disagree
      # on any deterministic case (a parity check at larger sizes than the fixtures).
      - run: python -m pip install -e . --group dev
        working-directory: python
      - run: python bench/run.py --size smoke --check

  javascript:
    if: inputs.minutes_checked
    name: Node ${{ matrix.node }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Dependencies need no install scripts; skipping them shrinks the
      # supply-chain surface. Our own prepack still runs in "npm pack".
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
