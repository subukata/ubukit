# Publishes both packages when a v* tag is pushed. The test job runs both test
# suites with their development dependencies; the build job installs only the
# build tools and packs both packages, so no test dependency can change the
# published files. Neither job has credentials, and the publish jobs only
# upload the built files with trusted publishing (OIDC), so no dependency code
# runs where a publishing token can be minted. npm waits for PyPI, so a
# failed upload never leaves the new version on npm alone. npm only stages
# the version: it is published when the maintainer approves it on npmjs.com
# with npm's two-factor authentication, which a compromised GitHub account
# cannot give.
# The one-time setup is listed under "Releasing" in CONTRIBUTING.md; the
# repository must be public, since npm does not generate provenance in
# private repositories. Both registries trust this workflow and its
# environment, so no publishing token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# pip installs wheels only: building a dependency from its source runs that
# package's own code (DESIGN.md, principle 8; npm skips install scripts).
# UbuKit itself is still built from this checkout. And pip takes only files
# uploaded at least a week ago, the cooldown Dependabot keeps for npm and the
# actions: most compromised releases are withdrawn within days. The isolated
# environments of builds, which install hatchling, follow both. The first pip
# command of each job gives the cutoff again as an option, so a pip too old
# for it (before 26.0), which would ignore the variable, stops the job there.
env:
  PIP_ONLY_BINARY: ":all:"
  PIP_UPLOADED_PRIOR_TO: P7D

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test the Python package
        working-directory: python
        run: |
          python -m pip install --upgrade --uploaded-prior-to P7D pip
          python -m pip install -e . --group dev
          pytest
      # The JavaScript tests need no dependencies.
      - name: Test the npm package
        working-directory: js
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history of main, to check that the tag is on it
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Only a commit of main is released: a tag on any other commit stops here,
      # before anything is built or uploaded.
      - name: Check that the tag is on main and matches both package versions
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/src/ubukit/__init__.py)" = "$GITHUB_REF_NAME"
          test "v$(node -p 'require("./js/package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build the Python package
        run: |
          python -m pip install --upgrade --uploaded-prior-to P7D pip
          python -m pip install build
          python -m build python --outdir dist/python
      # TypeScript, the only dependency, writes the type declarations (prepack).
      - name: Pack the npm package
        working-directory: js
        run: |
          npm ci --ignore-scripts
          mkdir -p ../dist/npm
          npm pack --pack-destination ../dist/npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/python/

  npm:
    needs: [test, build, pypi]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged, not published (npm 11.15 or newer, which Node 24 has bundled
      # since 24.18). The ./ prefix keeps npm from reading the path as a
      # GitHub "owner/repo".
      - run: npm stage publish ./dist/npm/*.tgz --provenance --access public --ignore-scripts
