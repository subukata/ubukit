# Publishes both packages when a v* tag is pushed. The test job runs both test
# suites with their development dependencies; the build job installs only the
# build tools and packs both packages, so no test dependency can change the
# published files. Neither job has credentials, and the publish jobs only
# upload the built files with trusted publishing (OIDC), so no dependency code
# runs where a publishing token can be minted. npm waits for PyPI, so a
# failed upload never leaves the new version on npm alone.
# The one-time setup is listed under "Releasing" in CONTRIBUTING.md: the
# repository must be public (npm does not generate provenance in private
# repositories), and npm can only trust a package that already exists, so the
# very first npm release reads a short-lived NPM_TOKEN secret from the "npm"
# environment; delete that secret once the trusted publisher is configured.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test the Python package
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
          pytest
      # The JavaScript tests need no dependencies.
      - name: Test the npm package
        working-directory: js
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check that the tag matches both package versions
        run: |
          test "v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/src/ubukit/__init__.py)" = "$GITHUB_REF_NAME"
          test "v$(node -p 'require("./js/package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build the Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build python --outdir dist/python
      # TypeScript, the only dependency, writes the type declarations (prepack).
      - name: Pack the npm package
        working-directory: js
        run: |
          npm ci --ignore-scripts
          mkdir -p ../dist/npm
          npm pack --pack-destination ../dist/npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/python/

  npm:
    needs: [test, build, pypi]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The ./ prefix keeps npm from reading the path as a GitHub "owner/repo".
      - run: npm publish ./dist/npm/*.tgz --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
