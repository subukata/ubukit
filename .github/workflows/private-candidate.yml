# One explicitly selected OS per dispatch. Check results and quota between stages.
name: Private candidate cross-platform validation
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Run only this OS; inspect results and free quota before the next stage
        required: true
        default: linux
        type: choice
        options: [linux, windows, macos]
      artifact_run_id:
        description: Successful Linux build run ID for reusing the same frozen artifacts (blank only for the first Linux stage)
        required: false
        default: ''
        type: string
      candidate_sha:
        description: Reviewed dev6 source commit (locked separately from the workflow commit)
        required: true
        default: '86321a9f1bc405ddb3251facfe1d876064c9c9dd'
        type: string
      free_budget_rechecked:
        description: I rechecked remaining allowance and the account-wide Actions $0 Stop usage budget
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read # Download this same private repository's already built artifact across stages
concurrency:
  group: ubukit-private-candidate-validation
  cancel-in-progress: false
# Preserve committed LF bytes on Windows without changing persistent git settings.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
jobs:
  build:
    if: ${{ inputs.free_budget_rechecked && github.repository == 'subukata/ubukit' && inputs.stage == 'linux' && inputs.artifact_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact source and build frozen artifacts once
        shell: bash
        run: |
          python harness/ci/release/scripts/verify_checkout.py candidate
          python -m pip install --no-cache-dir -r harness/ci/release/constraints/build-tools.txt
          python -m pip freeze --all
          node --version
          npm --version
          python harness/ci/release/scripts/build_candidate.py --source candidate --output candidate-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-candidate-${{ github.run_id }}
          path: candidate-dist/
          if-no-files-found: error
          retention-days: 1
  installed-and-browser:
    needs: build
    if: ${{ always() && inputs.free_budget_rechecked && github.repository == 'subukata/ubukit' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.artifact_run_id != '')) }}
    runs-on: ${{ inputs.stage == 'windows' && 'windows-2022' || inputs.stage == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-candidate-${{ inputs.artifact_run_id || github.run_id }}
          path: candidate-dist
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify final source and current verification harness
        id: source
        shell: bash
        run: python harness/ci/release/scripts/verify_checkout.py candidate candidate-dist harness
      - name: Python clean wheel and sdist installations
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = Linux ]; then extra+=(--full --include-large-sparse); fi
          python harness/ci/release/scripts/python_clean_install.py --python-root harness/preview/python --artifacts candidate-dist/python --constraints harness/ci/release/constraints/base-py312.txt --build-constraints harness/ci/release/constraints/build-tools.txt --output "$RUNNER_TEMP/python-result" "${extra[@]}"
      - name: JavaScript frozen tarball full suite
        id: javascript
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: python harness/ci/release/scripts/javascript_clean_install.py --javascript-root candidate/preview/javascript --frozen-artifacts candidate-dist/javascript --output "$RUNNER_TEMP/javascript-result"
      - name: Install locked browser test tools and engines
        id: browser_tools
        if: ${{ !cancelled() && steps.javascript.outcome == 'success' }}
        working-directory: harness/ci/release/browser
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Chromium Firefox WebKit normal and fallback cases
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        shell: bash
        run: node harness/ci/release/browser/run.mjs "$RUNNER_TEMP/javascript-result/candidate" "$RUNNER_TEMP/browser-results"
      - name: Collect bounded evidence
        id: evidence
        if: ${{ always() }}
        shell: bash
        run: python harness/ci/release/scripts/collect_evidence.py --temp "$RUNNER_TEMP" --source harness --output evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        with:
          name: result-${{ inputs.stage }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
