# Each ecosystem gets one pull request a month with all its version updates,
# and only for releases at least a week old: most compromised releases are
# withdrawn by then. CI runs on these pull requests like any other; check
# them as CONTRIBUTING.md says. Python requirements are lower bounds set by policy
# (SPEC 0), not pins, so pip is deliberately not listed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
