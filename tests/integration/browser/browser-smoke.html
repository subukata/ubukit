<!doctype html><meta charset="utf-8"><title>UbuKit JS external metrics browser validation</title>
<h1>UbuKit external metrics browser validation</h1><pre id="result">Running…</pre>
<script type="module">
import {adjustedRandScore as ari, adjustedMutualInfoScore as ami, adjustedScores as joint} from './consumer/node_modules/ubukit-js/src/index.js';
let checks=0,maxError=0;
function check(ok,message){checks++;if(!ok)throw new Error(message);}
try{
 const panel=await(await fetch('./fixtures/sklearn-1.8.json')).json();
 for(const c of panel.cases){
  const value=joint(c.a,c.b);check(Math.abs(value.ari-c.ari)<1e-15,c.name+' ARI');
  const e=Math.abs(value.ami-c.ami.arithmetic);maxError=Math.max(maxError,e);check(e<2e-10,c.name+' AMI '+e);
  check(value.ari===ari(c.a,c.b)&&value.ami===ami(c.a,c.b),c.name+' shared');
 }
 const worker=new Worker(new URL('./browser-worker.mjs',import.meta.url),{type:'module'});
 const message=await new Promise((resolve,reject)=>{worker.onmessage=e=>resolve(e.data);worker.onerror=reject;worker.postMessage({a:new Int32Array([0,0,1,1]),b:new Int32Array([0,1,0,1])});});
 worker.terminate();check(message.ari===-.5&&Math.abs(message.ami+.5)<1e-15,'Web Worker score');
 window.browserResult={status:'passed',checks,referenceCases:panel.cases.length,maxSklearnAMIAbsoluteError:maxError,userAgent:navigator.userAgent,worker:true};
 document.querySelector('#result').textContent=JSON.stringify(window.browserResult,null,2);
}catch(error){window.browserResult={status:'failed',checks,error:String(error),stack:error.stack};document.querySelector('#result').textContent=JSON.stringify(window.browserResult,null,2);}
</script>
