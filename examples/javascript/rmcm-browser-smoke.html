<!doctype html><html lang="en"><meta charset="utf-8"><title>RMCM browser smoke test</title>
<h1>RMCM browser smoke test</h1><p>This is a correctness and cancellation check, not a benchmark.</p>
<button id="start">Run tests</button><pre id="output">Ready</pre>
<script type="module">
import { rmcm, rmcmReference, runAsync, createWorkerClient } from '../../javascript/src/index.js';
const output=document.querySelector('#output');
const assert=(value,message)=>{if(!value)throw new Error(message);};
const serial=value=>JSON.stringify(value,(_,v)=>ArrayBuffer.isView(v)?[...v]:v);
const x={data:Float64Array.of(-1,-3,5,-3,3,4,-1,-2,1,-3,2,2),nSamples:6,nFeatures:2};
const options={delta:7.3,initCenters:Float64Array.of(1,-3,2,2)};
document.querySelector('#start').onclick=async()=>{
 const report={runtime:navigator.userAgent,cases:[]};const client=createWorkerClient();
 try{
  const fast=rmcm(x,options),reference=rmcmReference(x,options);
  assert(fast.stopReason==='cycle'&&!fast.converged&&fast.cycleLength===2&&fast.iterations===3,'exact cycle');
  assert(serial(fast.labels)===serial(reference.labels),'reference labels');
  for(let i=0;i<fast.centers.length;++i)assert(Math.abs(fast.centers[i]-reference.centers[i])<1e-12,'reference centers');
  report.cases.push('adjoint/reference exact-cycle contract');
  let progress=0;const worker=await client.run('rmcm',x,{...options,onProgress:()=>++progress});
  assert(serial(worker)===serial(fast)&&progress>0,'worker parity/progress');report.cases.push('worker parity and progress');
  let ticks=0;const timer=setInterval(()=>++ticks,0);let cooperative;
  try{cooperative=await runAsync('rmcm',x,{...options,timeBudgetMs:0,graphBatchPairs:2,blockRows:1});}finally{clearInterval(timer);}
  assert(ticks>0&&serial(cooperative)===serial(fast),'cooperative parity/heartbeat');report.cases.push('cooperative parity and heartbeat');
  const controller=new AbortController();let began=false;
  try{await client.run('rmcm',{data:Float64Array.from({length:300},(_,i)=>i),nSamples:300,nFeatures:1},{delta:1,nClusters:3,signal:controller.signal,onProgress:()=>{began=true;controller.abort();}});throw new Error('expected abort');}
  catch(e){assert(e.name==='AbortError'&&began,'worker abort');}
  assert((await client.run('rmcm',x,options)).stopReason==='cycle','worker reuse');report.cases.push('worker abort and reuse');
  report.status='PASS';
 }catch(e){report.status='FAIL';report.error=e.stack;}finally{client.dispose();output.textContent=JSON.stringify(report,null,2);}
};
</script></html>
