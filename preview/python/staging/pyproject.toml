[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ubukit-bundled-local-preview"
version = "0.0.0.dev5"
description = "Local-only UbuKit prototype with sample-major membership axes"
readme = "README.md"
requires-python = ">=3.10"
# No project-wide license has been selected. Retain original third-party notices.
license-files = ["LICENSE-SOM.txt", "NOTICE.txt", "NOTICE-EXTERNAL-METRICS.txt", "THIRD_PARTY_LICENSES.txt"]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "threadpoolctl>=3",
]

[project.optional-dependencies]
numba = ["numba>=0.60"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["rough_cmeans", "_numba_kernel", "external_metrics", "_external_metrics_numba"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ubukit", "portable_accel", "portable_accel.*", "ubukit_fcm", "ubukit_rmcm"]
namespaces = false
