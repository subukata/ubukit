[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ubukit"
dynamic = ["version"]
description = "Fuzzy, rough and classical clustering, self-organizing maps, evaluation metrics and TPE search"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
authors = [{ name = "Seiki Ubukata" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "scipy>=1.15"]
keywords = ["clustering", "fuzzy c-means", "rough clustering", "self-organizing map", "som-olp", "tpe"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.optional-dependencies]
# Compiled kernels for engine="numba"; 0.61.2 is the first to support NumPy 2.2.
numba = ["numba>=0.61.2"]

[project.urls]
Homepage = "https://github.com/subukata/ubukit"
Documentation = "https://github.com/subukata/ubukit/blob/main/docs/algorithms.md"
Issues = "https://github.com/subukata/ubukit/issues"

[dependency-groups]
# ruff and mypy stay within one minor series so that new rules and styles
# arrive only through a deliberate bump, not as a surprise failure. Numba is
# here so that the checks always test engine="numba".
dev = ["mypy~=2.4.0", "numba>=0.61.2", "pytest>=8", "ruff~=0.16.10", "scikit-learn>=1.6"]

[tool.hatch.version]
path = "src/ubukit/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]

[tool.mypy]
# The library, and in tests/typing_api.py how typed code calls it.
files = ["src", "tests/typing_api.py"]
check_untyped_defs = true
warn_unused_ignores = true

# SciPy and Numba ship no type information.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "numba", "numba.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
