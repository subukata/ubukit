[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ubukit"
dynamic = ["version"]
description = "Fuzzy, rough and classical clustering, self-organizing maps, evaluation metrics and TPE search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seiki Ubukata" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "scipy>=1.15"]
keywords = ["clustering", "fuzzy c-means", "rough clustering", "self-organizing map", "som-olp", "tpe"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/subukata/ubukit"
Documentation = "https://github.com/subukata/ubukit/blob/main/docs/algorithms.md"
Issues = "https://github.com/subukata/ubukit/issues"

[dependency-groups]
# ruff stays within one minor series so that new lint rules and formatter
# styles arrive only through a deliberate bump, not as a surprise CI failure.
dev = ["pytest>=8", "ruff~=0.16.10", "scikit-learn>=1.6"]

[tool.hatch.version]
path = "src/ubukit/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
