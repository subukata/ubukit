[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ubukit"
version = "0.1.0a3"
description = "Clustering, self-organizing maps, evaluation metrics, and parameter search"
readme = "README.md"
requires-python = ">=3.10"
# Project contributions are MIT; adapted compatibility portions retain BSD-3-Clause.
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSE-SCOPE.txt", "LICENSE-SOM.txt", "NOTICE.txt", "NOTICE-EXTERNAL-METRICS.txt", "THIRD_PARTY_LICENSES.txt"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "threadpoolctl>=3",
]

[project.optional-dependencies]
numba = ["numba>=0.60"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ubukit", "ubukit.*"]
namespaces = false
