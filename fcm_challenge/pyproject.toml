[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubukit-fcm"
version = "0.1.0a1"
description = "Portable standard fuzzy c-means candidate for UbuKit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "threadpoolctl>=3"]

[project.optional-dependencies]
numba = ["numba>=0.60"]
benchmark = ["scikit-fuzzy==0.5.0", "psutil>=5", "scikit-learn>=1.3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ubukit_fcm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
