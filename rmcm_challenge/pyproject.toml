[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubukit-rmcm"
version = "0.1.0a1"
description = "Delta-neighborhood Rough Membership C-means candidate for UbuKit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "threadpoolctl>=3"]

[project.optional-dependencies]
numba = ["numba>=0.60"]
test = ["pytest>=8"]
benchmark = ["psutil>=5"]

[tool.setuptools.packages.find]
include = ["ubukit_rmcm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
